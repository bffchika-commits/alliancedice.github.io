<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cameraman Cases</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--card:#151b24;--gold:#f5b81c;--txt:#f2f4f7;--mut:#8b95a5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% 0,#1e2735,var(--bg) 60%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:16px}
.hidden{display:none!important}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#070a0e;border-bottom:1px solid #1a2230;margin-bottom:8px}
.coinbtn{width:48px;height:48px;padding:0;border-radius:50%;background:none;z-index:2;box-shadow:0 4px 14px #0008}
.coinbtn img{width:100%;height:100%;border-radius:50%;display:block}
.pill{height:36px;padding:0 16px;background:var(--card);border:1px solid #263041;color:var(--gold);border-radius:999px;display:flex;align-items:center;font-weight:700;gap:6px}
.dd{position:absolute;top:64px;left:16px;background:var(--card);border:1px solid #263041;border-radius:14px;padding:6px;z-index:10;min-width:190px;box-shadow:0 8px 24px #000a}
.dd button{display:block;width:100%;text-align:left;background:none;color:var(--txt);border-radius:10px;padding:12px 14px}
.dd button:hover{background:#222b39}
h1{text-align:center;font-size:2rem;margin:8px 0 28px;color:var(--gold)}
.case{max-width:340px;margin:0 auto;background:var(--card);border:1px solid #263041;border-radius:20px;padding:16px;text-align:center}
.case img{width:100%;border-radius:14px;display:block}
.case h2{margin:14px 0 4px;font-size:1.3rem}
.price{color:var(--gold);font-weight:700;font-size:1.2rem;margin-bottom:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 28px;font-weight:700;background:var(--gold);color:#201600}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:default}
.back{background:#222b39;color:var(--txt);padding:8px 16px;margin-bottom:12px}
.roll{text-align:center}
.vp{position:relative;overflow:hidden;background:#0e131a;border:1px solid #263041;border-radius:16px;height:180px;margin:12px 0 18px}
.vp::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--gold);transform:translateX(-50%);box-shadow:0 0 12px var(--gold);z-index:2}
.strip{display:flex;align-items:center;height:100%;will-change:transform}
.it{flex:0 0 140px;margin:0 8px;height:140px;background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.it img{width:100%}
#res{min-height:44px;font-size:1.15rem;font-weight:700;color:var(--gold);margin:14px 0}
#res button{margin-left:10px;padding:8px 16px}
h3{margin:28px 0 12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.d{background:var(--card);border:1px solid #263041;border-radius:14px;padding:10px;text-align:center}
.d img{width:100%;border-radius:8px}
.d b{display:block;margin:8px 0 4px}
.d span{color:var(--gold);font-size:.9rem}
.d button{margin-top:8px;padding:8px 10px;width:100%;font-size:.85rem}
.big{display:flex;align-items:center;justify-content:center;gap:12px;font-size:2rem;font-weight:800;color:var(--gold)}
.big img{width:48px;height:48px;border-radius:50%}
.sa{display:block;margin:16px auto 0;background:#222b39;color:var(--txt)}
.empty{color:var(--mut);text-align:center;padding:20px}
.prof{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid #263041;border-radius:18px;padding:16px}
.av{width:84px;height:84px;border-radius:50%;overflow:hidden;cursor:pointer;background:#222b39;flex:none;display:block}
.av img{width:100%;height:100%;object-fit:cover;display:block}
#nick{flex:1;min-width:120px;background:transparent;border:0;border-bottom:1px solid #263041;color:var(--txt);font:inherit;font-size:1.4rem;font-weight:700;padding:6px 0;outline:none}
.tk{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:800;font-size:1.5rem}
.tk img{width:36px;height:36px;border-radius:50%}
.tk small{color:var(--mut);font-size:.8rem;font-weight:600}
</style></head><body>

var COST=280,KEY="cameraman_cases_v1",S={t:1000,inv:[],n:"",av:""},busy=false;
var DEF="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><rect width='80' height='80' fill='%23222b39'/><circle cx='40' cy='32' r='14' fill='%238b95a5'/><path d='M12 76c2-18 14-26 28-26s26 8 28 26z' fill='%238b95a5'/></svg>";
var $=function(i){return document.getElementById(i)};
try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o.t==="number"&&Array.isArray(o.inv)){if(typeof o.n!=="string")o.n="";if(typeof o.av!=="string")o.av="";S=o}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function render(){
$("bal").textContent=S.t;$("big").textContent=S.t;$("avimg").src=S.av||DEF;if(document.activeElement!==$("nick"))$("nick").value=S.n;
$("inv").innerHTML=S.inv.length?S.inv.map(function(v){var x=items[v.k];return '<div class="d"><img src="'+x.i+'" alt=""><b>'+x.n+'</b><span>'+x.p+' токенов</span><button data-sell="'+v.id+'">Продать</button></div>'}).join(""):'<div class="empty" style="grid-column:1/-1">Инвентарь пуст</div>';
$("sellall").classList.toggle("hidden",!S.inv.length);
}
function sell(id){var j=S.inv.findIndex(function(v){return v.id===id});if(j<0)return;S.t+=items[S.inv[j].k].p;S.inv.splice(j,1);save();render()}
$("drops").innerHTML=items.map(function(x){return '<div class="d"><img src="'+x.i+'" alt=""><b>'+x.n+'</b><span>'+x.p+' токенов</span></div>'}).join("");
function pick(){var r=Math.random()*100,s=0;for(var k=0;k<items.length;k++){s+=items[k].c;if(r<s)return k}return 2}
function cell(k){return '<div class="it"><img src="'+items[k].i+'" alt=""></div>'}
function go(n){if(busy)return;["menu","view","profile"].forEach(function(s){$(s).classList.toggle("hidden",s!==n)});$("dd").classList.add("hidden");if(n==="view"){$("res").textContent="";$("strip").innerHTML=Array.from({length:10}).map(function(){return cell(pick())}).join("");$("strip").style.transition="none";$("strip").style.transform="translateX(0)"}render()}
$("coin").onclick=function(e){e.stopPropagation();$("dd").classList.toggle("hidden")};
document.addEventListener("click",function(e){$("dd").classList.add("hidden");var g=e.target.getAttribute&&e.target.getAttribute("data-go");if(g)go(g);var s=e.target.getAttribute&&e.target.getAttribute("data-sell");if(s){sell(s);if($("res").getAttribute("data-id")===s){$("res").textContent="Продано"}}});
$("open").onclick=function(){go("view")};
$("sellall").onclick=function(){S.inv.forEach(function(v){S.t+=items[v.k].p});S.inv=[];save();render()};
$("spin").onclick=function(){
if(busy)return;
if(S.t<COST){$("res").textContent="Не хватает токенов";return}
busy=true;$("spin").disabled=true;$("res").textContent="";
var k=pick(),N=40,W=32,id=Date.now()+"-"+Math.floor(Math.random()*1e6);
S.t-=COST;S.inv.push({id:id,k:k});save();$("bal").textContent=S.t;
var h="";for(var q=0;q<N;q++)h+=cell(q==W?k:pick());
var s=$("strip");s.style.transition="none";s.style.transform="translateX(0)";s.innerHTML=h;s.offsetWidth;
var vp=s.parentNode.offsetWidth,x=W*156+78-vp/2+(Math.random()*80-40);
s.style.transition="transform 5s cubic-bezier(.1,.7,.1,1)";
s.style.transform="translateX(-"+x+"px)";
setTimeout(function(){
busy=false;$("spin").disabled=false;render();
var res=$("res");res.setAttribute("data-id",id);
res.innerHTML="Выпало: "+items[k].n+' <button data-sell="'+id+'">Продать за '+items[k].p+'</button>';
},5200)};
$("nick").onchange=function(){S.n=this.value.slice(0,16);save()};
$("avf").onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=160;var m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.av=c.toDataURL("image/jpeg",.8);save();render()};im.src=rd.result};rd.readAsDataURL(f)};
render();
</script></body></html>
